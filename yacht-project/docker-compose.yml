services:
  booking-db:
    image: postgres:17
    container_name: yacht-booking-db
    environment:
      POSTGRES_DB: yacht_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data

  catalog-db:
    image: postgres:17
    container_name: yacht-catalog-db
    environment:
      POSTGRES_DB: yacht_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55433:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  catalog-service:
    build:
      context: .
      dockerfile: src/YachtSharing.CatalogService/Dockerfile
    container_name: yacht-catalog-service
    depends_on:
      catalog-db:
        condition: service_healthy
    restart: on-failure
    ports:
      - "5002:8080"
      - "8082:8082"
    environment:
      ConnectionStrings__CatalogDb: Host=catalog-db;Port=5432;Database=yacht_catalog;Username=postgres;Password=postgres

  mock-gims:
    build:
      context: .
      dockerfile: src/YachtSharing.MockGims/Dockerfile
    container_name: yacht-mock-gims
    ports:
      - "7001:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080

  booking-service:
    build:
      context: .
      dockerfile: src/YachtSharing.BookingService/Dockerfile
    container_name: yacht-booking-service
    depends_on:
      - booking-db
      - catalog-service
      - mock-gims
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=booking-db;Port=5432;Database=yacht_booking;Username=postgres;Password=postgres
      IntegrationServices__CatalogGrpcUrl: http://catalog-service:8082
      IntegrationServices__GimsBaseUrl: http://mock-gims:8080/

volumes:
  booking-db-data:
  catalog-db-data:
